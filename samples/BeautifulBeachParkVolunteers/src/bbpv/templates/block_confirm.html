{% extends "base.html" %}
{% set title = w.SCREEN.block_title %}
{% block content %}
<h1>{{ w.SCREEN.block_title }}</h1>
<p>{{ w.block_confirm(volunteer.username) }}</p>
<form method="post" action="/volunteers/{{ volunteer.username }}/block{% if slot %}?slot={{ slot }}{% endif %}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input type="hidden" name="confirm" value="yes">
  <button class="btn danger" type="submit">{{ w.SCREEN.yes_block }}</button>
</form>
<a class="btn secondary" href="{{ back }}">{{ w.SCREEN.dont_block }}</a>
{% endblock %}
