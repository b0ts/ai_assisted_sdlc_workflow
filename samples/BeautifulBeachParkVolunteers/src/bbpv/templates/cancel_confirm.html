{% extends "base.html" %}
{% set title = "Cancel this sign-up?" %}
{% block content %}
<h1>Cancel this sign-up?</h1>
<p>{{ row.title }}, {{ row.date|day_heading }}, {{ row|slot_time }}. Your place will open for someone else.</p>
<form method="post" action="/sign-ups/{{ row.id }}/cancel">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input type="hidden" name="confirm" value="yes">
  <button class="btn" type="submit">Yes, cancel</button>
</form>
<a class="btn secondary" href="/my-sign-ups">Keep my sign-up</a>
{% endblock %}
